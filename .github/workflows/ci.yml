on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      WORKDIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - name: FSD CI Checks
        id: fsd
        uses: ksh5324/fsd-ci-action@v2.0.1
        with:
          working-directory: ${{ env.WORKDIR }}
          comment-on-pr: true
          upload-artifacts: true
          comment-mode: replace
          comment-header: "<!-- ci-checks-summary -->"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if checks failed
        if: ${{ always() }}
        run: |
          lint_code="${{ steps.fsd.outputs.lint-exit-code }}"
          type_code="${{ steps.fsd.outputs.typecheck-exit-code }}"
          fsd_code="${{ steps.fsd.outputs.fsd-exit-code }}"
          build_code="${{ steps.fsd.outputs.build-exit-code }}"
          fsd_has_errors="${{ steps.fsd.outputs.fsd-has-errors }}"

          if [ "${lint_code:-0}" != "0" ] || \
             [ "${type_code:-0}" != "0" ] || \
             [ "${build_code:-0}" != "0" ] || \
             [ "${fsd_has_errors:-0}" = "1" ] || \
             [ "${fsd_code:-0}" != "0" ]; then
            echo "One or more checks failed."
            exit 1
          fi